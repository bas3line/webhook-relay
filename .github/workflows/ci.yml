name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the repo; a compromised step gets a token that cannot write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Typecheck, the tests, and the Worker bundled the way Cloudflare will bundle it.
      # Deploys happen in Cloudflare (Workers Builds), not here.
      - run: npm run check
