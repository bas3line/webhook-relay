      .badge { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .time { font-size: 12px; fill: #949ba4; }
      .title { font-size: 16px; font-weight: 700; fill: #00a8fc; }
      .name { font-size: 13.5px; font-weight: 700; fill: #f2f3f5; }
      .value { font-size: 14px; fill: #dbdee1; }
      .mono { font-family: Consolas,'Andale Mono WT','Andale Mono','Lucida Console',Menlo,ui-monospace,monospace; font-size: 12.5px; fill: #dbdee1; }
      .footer { font-size: 12px; fill: #b5bac1; }
    </style>
  </defs>
  <rect width="616" height="356" rx="12" fill="#313338"/>
