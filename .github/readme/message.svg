<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 356" width="616" height="356" role="img" aria-label="Two Discord messages from boat, with boat's logo: Production worker is ready, on a green bar, and Production worker is degraded, on an amber one with the reason">
  <title>webhook-relay: boat events as Discord messages</title>
  <defs>
    <clipPath id="avatar"><circle cx="36" cy="36" r="20"/></clipPath><clipPath id="small0"><circle cx="102" cy="154" r="10"/></clipPath><clipPath id="small1"><circle cx="102" cy="326" r="10"/></clipPath>
    <style>
      text { font-family: 'gg sans','Noto Sans','Helvetica Neue',Helvetica,Arial,sans-serif; }
